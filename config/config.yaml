# AgroVision-Mine Global Configuration

project:
  name: "AgroVision-Mine"
  version: "1.0.0"
  description: "Multimodal Data Warehouse and Visual Pattern Mining Framework for Crop Disease and Pest Intelligence"
  review_stage: "Review 1"

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  features_data_dir: "data/features"
  features_dir: "data/features"
  reports_dir: "data/reports"
  schema_dir: "database/schema"
  database_dir: "database"
  logs_dir: "logs"

preprocessing:
  target_size: [256, 256] # [width, height]
  allowed_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp", ".tiff"]
  color_space: "RGB"
  normalize: true
  min_dimension: 32
  max_dimension: 8192
  blur_laplacian_threshold: 100.0  # Images below this variance are flagged as blurry
  duplicate_detection:
    method: "combined" # md5 for exact, phash for near-duplicates
    phash_hamming_threshold: 5

feature_extraction:
  color:
    enabled: true
    channels: ["RGB", "HSV"]
    compute_moments: true # mean, std, skewness
    histogram_bins: 16
  texture:
    enabled: true
    method: "glcm"
    distances: [1, 3]
    angles: [0, 0.7853981633974483, 1.5707963267948966, 2.356194490192345] # 0, 45, 90, 135 deg
    properties: ["contrast", "dissimilarity", "homogeneity", "energy", "correlation", "ASM"]
  shape:
    enabled: true
    extract_contours: true
    min_contour_area: 50.0

warehouse:
  default_dialect: "sqlite"
  sqlite_path: "database/agrovision_warehouse.db"
  schema_name: "agrovision_dw"
  echo_sql: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agrovision.log"
